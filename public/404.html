<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Redirecting…</title>
  <script>
    // GitHub Pages / Cloudflare Pages SPA fallback: only recover known app routes.
    // Everything else should remain a hard 404 instead of looping back into the SPA.
    const currentPath = window.location.pathname + window.location.search + window.location.hash;
    const knownPaths = new Set(["/", "/spotify", "/time-capsule"]);

    if (knownPaths.has(window.location.pathname)) {
      const redirectUrl = new URL("/", window.location.origin);
      redirectUrl.searchParams.set('redirect', currentPath);
      window.location.replace(redirectUrl.toString());
    }
  </script>
</head>

<body>
  Redirecting…
</body>

</html>
