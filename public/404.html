<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Redirecting…</title>
  <script>
    // GitHub Pages / Cloudflare Pages SPA fallback: redirect non-API routes to the app root.
    // API routes must not be bounced back into the SPA shell or they can loop.
    const currentPath = window.location.pathname + window.location.search + window.location.hash;
    const firstSegment = window.location.pathname.split("/").filter(Boolean)[0] || "";
    const appBase = firstSegment && firstSegment !== "api" && firstSegment !== "spotify" && firstSegment !== "time-capsule"
      ? `/${firstSegment}/`
      : "/";
    if (!window.location.pathname.startsWith("/api/")) {
      const redirectUrl = new URL(appBase, window.location.origin);
      redirectUrl.searchParams.set('redirect', currentPath);
      window.location.replace(redirectUrl.toString());
    }
  </script>
</head>

<body>
  Redirecting…
</body>

</html>
