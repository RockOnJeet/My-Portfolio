<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Redirecting…</title>
  <script>
    // GitHub Pages / Cloudflare Pages SPA fallback: redirect unknown routes to the app root.
    // Use a relative URL so project sites resolve to /<repo>/ and root sites resolve to /.
    const base = new URL("./", window.location.href);
    const currentPath = window.location.pathname + window.location.search + window.location.hash;
    const redirectUrl = new URL(base.toString());
    redirectUrl.searchParams.set('redirect', currentPath);
    window.location.replace(redirectUrl.toString());
  </script>
</head>

<body>
  Redirecting…
</body>

</html>
